# Builds the installer on GitHub and publishes a release whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test --nologo

      - name: Version from tag
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          # Google OAuth client for the calendar (see docs/google-calendar.md).
          YATA_GOOGLE_CLIENT_ID: ${{ secrets.YATA_GOOGLE_CLIENT_ID }}
          YATA_GOOGLE_CLIENT_SECRET: ${{ secrets.YATA_GOOGLE_CLIENT_SECRET }}
        run: |
          # v0.1.0 shipped without them because the secrets came later: refuse to release that way again.
          if (-not $env:YATA_GOOGLE_CLIENT_ID -or -not $env:YATA_GOOGLE_CLIENT_SECRET) {
            throw "YATA_GOOGLE_CLIENT_ID / YATA_GOOGLE_CLIENT_SECRET secrets are missing"
          }
          ./tools/build-installer.ps1 -Version $env:VERSION

      - name: Check the Google client is in the build
        shell: pwsh
        # The single-file exe keeps Yata.dll uncompressed, so the metadata key is plain text in it.
        # Only presence is reported; the values never reach the log.
        run: |
          $bytes = [IO.File]::ReadAllBytes("publish\Yata.exe")
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          foreach ($key in "GoogleClientId", "GoogleClientSecret") {
            if (-not $text.Contains($key)) { throw "$key is not embedded in publish\Yata.exe" }
          }
          if (-not $text.Contains(".apps.googleusercontent.com")) { throw "Google client id not found in publish\Yata.exe" }
          "Google client embedded"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
