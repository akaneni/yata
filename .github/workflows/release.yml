# Builds the installer on GitHub and publishes a release whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test --nologo

      - name: Version from tag
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          # Google OAuth client for the calendar (see docs/google-calendar.md).
          YATA_GOOGLE_CLIENT_ID: ${{ secrets.YATA_GOOGLE_CLIENT_ID }}
          YATA_GOOGLE_CLIENT_SECRET: ${{ secrets.YATA_GOOGLE_CLIENT_SECRET }}
        run: ./tools/build-installer.ps1 -Version $env:VERSION

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
