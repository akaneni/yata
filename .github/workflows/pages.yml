# Publishes getyata.app (site/, built by tools/make-site.ps1) to GitHub Pages.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/brand/**"
      - "tools/make-site.ps1"
      - "src/Yata/Assets/yata.ico"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: ./tools/make-site.ps1

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
