# Builds and tests every push and pull request. Releases are a separate workflow (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build -c Release --nologo -warnaserror

      - name: Tests
        run: dotnet test -c Release --no-build --nologo
