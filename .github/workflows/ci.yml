# Builds and tests every push and pull request. Releases are a separate workflow (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build -c Release --nologo -warnaserror

      - name: Tests
        run: dotnet test -c Release --no-build --nologo

      # Catches a missing translation or leftover {{token}} before it reaches the Pages deploy.
      - name: Site
        shell: pwsh
        run: ./tools/make-site.ps1

      # The built site, to look at a PR's changes before they deploy.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 7
